server:
  address: ":8000"

grpcGateway:
  address: ":8003"

consul:
  addr: "172.19.0.29:8500" # 容器内直接访问Consul

# Jaeger 配置
jaeger:
  endpoint: "jaeger:4317" # Jaeger OTLP gRPC 端点
  serviceName: "jh_gateway" # 服务名称
  serviceVersion: "1.0.0" # 服务版本
  environment: "development" # 环境
  enabled: true # 是否启用追踪

jwt:
  secret: "be0axSSXmguDZ2Q0EIPgRwq9e5G9nRH3zq3iEw6nllU="
  manageSecret: "d0RegRQwDAeCZlvM4pGRn8eUhSs99Cag+FSZACaj8Fo="

rateLimit:
  # 默认每分钟最多请求次数（优先按 user_id/admin_id，否则按 IP）
  requestsPerMinute: 120
  # 按接口精确路径或前缀覆盖默认阈值（精确匹配优先，其次最长前缀匹配）
  # requestsPerMinute: 0 表示该接口禁用限流
  routes:
    # 登录类接口收紧
    - exactPath: "/api/frontend/app/login"
      requestsPerMinute: 20
    - exactPath: "/api/backend/app/login"
      requestsPerMinute: 5
    # 支付类接口更严格
#    - pathPrefix: "/api/frontend/balance/withdraw"
#      requestsPerMinute: 20
    - exactPath: "/api/frontend/balance/withdraw"
      requestsPerMinute: 20

# 日志配置 - JSON格式
logger:
  level: "all"
  stdout: true
  # 使用JSON格式输出
  format: "json"
  # 时间格式
  timeFormat: "2006-01-02T15:04:05.000Z07:00"

# 时区配置
timezone: "Asia/Shanghai" # 北京时间

# Redis 配置示例
redis:
  # 单实例配置示例1
  default:
    address: 172.19.0.6:6379
    db: 1
    pass: 654321
