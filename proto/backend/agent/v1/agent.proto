syntax = "proto3";

package agent;

option go_package = "jh_gateway/api/backend/agent/v1";

service Agent {
  rpc GetAgentList(GetAgentListReq) returns (GetAgentListRes) {}
  rpc CreateAgent(CreateAgentReq) returns (CreateAgentRes) {}
  rpc UpdateAgent(UpdateAgentReq) returns (UpdateAgentRes) {}
  rpc DeleteAgent(DeleteAgentReq) returns (DeleteAgentRes) {}
}

message GetAgentListReq {
  int32 page = 1;
  int32 size = 2;
  int32 status = 3;
  string name = 4;
}

message AgentItem {
  int64 id = 1;
  int64 parent_id = 2;
  string agent_code = 3;
  string agent_name = 4;
  int32 status = 5;
  string status_name = 6;
  int32 settle_type = 7;
  string settle_type_name = 8;
  double rate = 9;
  string remark = 10;
  string created_at = 11;
  string updated_at = 12;
}

message OptionItem {
  int32 value = 1;
  string name = 2;
}

message GetAgentListRes {
  repeated AgentItem list = 1;
  int32 total = 2;
  int32 current_page = 3;
  int32 per_page = 4;
  repeated OptionItem status_list = 5;
  repeated OptionItem settle_type_list = 6;
}

message CreateAgentReq {
  int64 parent_id = 1;
  string agent_code = 2;
  string agent_name = 3;
  int32 status = 4;
  int32 settle_type = 5;
  double rate = 6;
  string remark = 7;
}

message CreateAgentRes {}

message UpdateAgentReq {
  int64 id = 1;
  int64 parent_id = 2;
  string agent_code = 3;
  string agent_name = 4;
  int32 status = 5;
  int32 settle_type = 6;
  double rate = 7;
  string remark = 8;
}

message UpdateAgentRes {}

message DeleteAgentReq {
  int64 id = 1;
}

message DeleteAgentRes {}
