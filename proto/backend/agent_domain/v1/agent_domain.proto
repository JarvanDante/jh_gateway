syntax = "proto3";

package agent_domain;

option go_package = "jh_gateway/api/backend/agent_domain/v1";

service AgentDomain {
  rpc GetAgentDomainList(GetAgentDomainListReq) returns (GetAgentDomainListRes) {}
  rpc CreateAgentDomain(CreateAgentDomainReq) returns (CreateAgentDomainRes) {}
  rpc UpdateAgentDomain(UpdateAgentDomainReq) returns (UpdateAgentDomainRes) {}
  rpc DeleteAgentDomain(DeleteAgentDomainReq) returns (DeleteAgentDomainRes) {}
}

message GetAgentDomainListReq {
  int32 page = 1;
  int32 size = 2;
  int64 agent_id = 3;
  int32 status = 4;
  string domain = 5;
}

message AgentDomainItem {
  int64 id = 1;
  int64 agent_id = 2;
  string agent_name = 3;
  string domain = 4;
  int32 status = 5;
  string status_name = 6;
  string created_at = 7;
  string updated_at = 8;
}

message OptionItem {
  int32 value = 1;
  string name = 2;
}

message GetAgentDomainListRes {
  repeated AgentDomainItem list = 1;
  int32 total = 2;
  int32 current_page = 3;
  int32 per_page = 4;
  repeated OptionItem status_list = 5;
}

message CreateAgentDomainReq {
  int64 agent_id = 1;
  string domain = 2;
  int32 status = 3;
}

message CreateAgentDomainRes {}

message UpdateAgentDomainReq {
  int64 id = 1;
  int64 agent_id = 2;
  string domain = 3;
  int32 status = 4;
}

message UpdateAgentDomainRes {}

message DeleteAgentDomainReq {
  int64 id = 1;
}

message DeleteAgentDomainRes {}
