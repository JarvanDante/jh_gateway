apiVersion: v1
kind: ConfigMap
metadata:
  name: jh-gateway-config
  namespace: jh-test
data:
  config.yaml: |
    server:
      address: ":8100"

    grpcGateway:
      address: ":8003"

    consul:
      addr: "172.19.0.29:8500" # 容器内直接访问Consul

    # Jaeger 配置
    jaeger:
      endpoint: "jaeger:4317" # Jaeger OTLP gRPC 端点
      serviceName: "jh_gateway" # 服务名称
      serviceVersion: "1.0.0" # 服务版本
      environment: "development" # 环境
      enabled: true # 是否启用追踪

    jwt:
      secret: "be0axSSXmguDZ2Q0EIPgRwq9e5G9nRH3zq3iEw6nllU="
      manageSecret: "d0RegRQwDAeCZlvM4pGRn8eUhSs99Cag+FSZACaj8Fo="

    rateLimit:
      # 默认每分钟最多请求次数（优先按 user_id/admin_id，否则按 IP）
      requestsPerMinute: 240
      # 全局每分钟请求上限（不区分接口，用于拦截整页F5狂刷）
      globalRequestsPerMinute: 160
      # 恶意刷流量防护：短时多次触发429后，临时封禁IP
      block:
        enabled: true
        threshold: 10         # 在 windowSeconds 时间窗内，触发429达到该次数即封禁
        windowSeconds: 300    # 统计时间窗（秒）
        durationSeconds: 1800 # 封禁时长（秒）
        whitelistIPs: []      # 白名单IP（如运维出口IP）
      # 按接口精确路径或前缀覆盖默认阈值（精确匹配优先，其次最长前缀匹配）
      # requestsPerMinute: 0 表示该接口禁用限流
      routes:
        # ===== 前台认证相关（收紧） =====
        - exactPath: "/api/frontend/app/login"
          requestsPerMinute: 24
        - exactPath: "/api/frontend/app/register"
          requestsPerMinute: 24
        - exactPath: "/api/frontend/app/captcha"
          requestsPerMinute: 24
        - exactPath: "/api/frontend/app/refresh-token"
          requestsPerMinute: 36
        - exactPath: "/api/frontend/app/sign-session"
          requestsPerMinute: 48

        # ===== 前台高频读接口（适中） =====
        - exactPath: "/api/frontend/app/user-info"
          requestsPerMinute: 108
        - exactPath: "/api/frontend/app/grade-list"
          requestsPerMinute: 108
        - exactPath: "/api/frontend/balance/refresh-balance"
          requestsPerMinute: 72
        - exactPath: "/api/frontend/balance/vip-upgrade-progress"
          requestsPerMinute: 72
        - exactPath: "/api/frontend/app/app-unread-count"
          requestsPerMinute: 72

        # ===== 前台公共接口（可放宽） =====
        - exactPath: "/api/frontend/app/setting-site"
          requestsPerMinute: 216
        - exactPath: "/api/frontend/app/ad-list"
          requestsPerMinute: 216
        - exactPath: "/api/frontend/app/notice-list"
          requestsPerMinute: 216
        - exactPath: "/api/frontend/game/game-categories"
          requestsPerMinute: 144
        - exactPath: "/api/frontend/game/frontend-game-list"
          requestsPerMinute: 144

        # ===== 资金敏感接口（严格） =====
        - exactPath: "/api/frontend/balance/deposit-order"
          requestsPerMinute: 36
        - exactPath: "/api/frontend/balance/withdraw"
          requestsPerMinute: 24
        - exactPath: "/api/frontend/balance/wash-code-rebate"
          requestsPerMinute: 24
        - exactPath: "/api/frontend/game/redirect-to-game"
          requestsPerMinute: 48

        # ===== 兼容旧路由（与前台规则保持一致） =====
        - exactPath: "/api/balance/refresh-balance"
          requestsPerMinute: 72
        - exactPath: "/api/balance/vip-upgrade-progress"
          requestsPerMinute: 72
        - exactPath: "/api/balance/deposit-order"
          requestsPerMinute: 36
        - exactPath: "/api/balance/withdraw"
          requestsPerMinute: 24
        - exactPath: "/api/game/frontend-game-list"
          requestsPerMinute: 144
        - exactPath: "/api/game/game-categories"
          requestsPerMinute: 144

        # 后台登录接口
        - exactPath: "/api/backend/app/login"
          requestsPerMinute: 36

    # 日志配置 - JSON格式
    logger:
      level: "all"
      stdout: true
      # 使用JSON格式输出
      format: "json"
      # 时间格式
      timeFormat: "2006-01-02T15:04:05.000Z07:00"

    # 时区配置
    timezone: "Asia/Shanghai" # 北京时间

    # ClickHouse 配置
    clickhouse:
      host: "172.19.0.35" # ClickHouse服务地址
      port: 9000 # ClickHouse原生协议端口（9000）
      database: "game_analytics" # 数据库名称
      username: "default" # 用户名
      password: "123456" # 密码

    # Redis 配置示例
    redis:
      # 单实例配置示例1
      default:
        address: 172.19.0.6:6379
        db: 1
        pass: 654321

    # API签名校验（灰度开关）
    apiSignature:
      enabled: true                  # 总开关
      required: true                 # true=强制所有请求都带签名；false=不带签名头时放行（灰度）
      allowedTimeSkewSeconds: 300     # 时间戳允许偏移秒数
      nonceTTLSeconds: 300            # nonce防重放有效期
      frontendSessionTTLSeconds: 600  # 前台动态签名会话有效期（秒）
      defaultAppId: "default"
      # 按后缀匹配跳过签名的路径
      skipPaths:
        - "/gateway/health"
        - "/login"
        - "/logout"
        - "/refresh-token"
        - "/captcha"
        - "/sign-session"
      # appId -> secret（请改成真实高强度密钥）
      appSecrets:
        default: "ac70e8c26a2556dea1d6a4cb83d8164e2fd2"
      # 本地调试兜底（仅开发环境建议开启）
      devBypass:
        enabled: true   #前线前务必，把它关掉：enabled: false
        hosts:
          - "i.jhh5.com"
          - "*.jhh5.com"
