apiVersion: apps/v1
kind: Deployment
metadata:
  name: jh-gateway
  namespace: jh-test
  labels:
    app: jh-gateway
    env: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jh-gateway
  template:
    metadata:
      labels:
        app: jh-gateway
        env: test
    spec:
      containers:
        - name: jh-gateway
          image: jh_gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
            - name: grpc
              containerPort: 8003
          readinessProbe:
            httpGet:
              path: /gateway/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /gateway/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
