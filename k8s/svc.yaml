apiVersion: v1
kind: Service
metadata:
  name: jh-gateway
  namespace: jh-test
  labels:
    app: jh-gateway
    env: test
spec:
  selector:
    app: jh-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: grpc
      port: 8003
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: consul
  namespace: jh-test
spec:
  type: ExternalName
  externalName: host.docker.internal
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: jh-test
spec:
  type: ExternalName
  externalName: host.docker.internal
---
apiVersion: v1
kind: Service
metadata:
  name: jh-gateway
  namespace: jh-prod
  labels:
    app: jh-gateway
    env: prod
spec:
  selector:
    app: jh-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: grpc
      port: 8003
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: consul
  namespace: jh-prod
spec:
  type: ExternalName
  externalName: host.docker.internal
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: jh-prod
spec:
  type: ExternalName
  externalName: host.docker.internal
