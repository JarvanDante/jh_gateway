apiVersion: v1
kind: Service
metadata:
  name: jh-gateway
  namespace: jh-test
  labels:
    app: jh-gateway
    env: test
spec:
  selector:
    app: jh-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: grpc
      port: 8003
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: consul
  namespace: jh-test
spec:
  type: ExternalName
  externalName: host.docker.internal
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: jh-test
spec:
  type: ExternalName
  externalName: host.docker.internal
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: jh-test
spec:
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: jaeger
  namespace: jh-test
  labels:
    kubernetes.io/service-name: jaeger
addressType: IPv4
ports:
  - name: otlp-grpc
    port: 4317
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.65.254
---
apiVersion: v1
kind: Service
metadata:
