syntax = "proto3";

package customer;

option go_package = "./api/manage/customer/v1";

service Customer {
    rpc GetCustomerList(GetCustomerListReq) returns (GetCustomerListRes) {}
    rpc UpdateCustomer(UpdateCustomerReq) returns (UpdateCustomerRes) {}
    rpc DeleteCustomer(DeleteCustomerReq) returns (DeleteCustomerRes) {}
    rpc SyncCustomer(SyncCustomerReq) returns (SyncCustomerRes) {}
}

// 获取商户列表请求
message GetCustomerListReq {}

// 获取商户列表响应
message GetCustomerListRes {
    repeated CustomerItem list = 1;
}

// 商户项
message CustomerItem {
    int32 id = 1;
    string code = 2;
    string name = 3;
    int32 status = 4;
    string created_at = 5;
    string updated_at = 6;
}

// 更新商户请求
message UpdateCustomerReq {
    int32 id = 1;           // v: required|min:1
    string name = 2;
    int32 status = 3;
}

// 更新商户响应
message UpdateCustomerRes {}

// 删除商户请求
message DeleteCustomerReq {
    int32 id = 1;           // v: required|min:1
}

// 删除商户响应
message DeleteCustomerRes {}

// 同步商户请求
message SyncCustomerReq {
    repeated CustomerItem data = 1;
}

// 同步商户响应
message SyncCustomerRes {}