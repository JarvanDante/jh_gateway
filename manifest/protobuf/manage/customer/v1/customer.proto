syntax = "proto3";

package customer;

option go_package = "./api/manage/customer/v1";

service Customer {
    rpc GetCustomerList(GetCustomerListReq) returns (GetCustomerListRes) {}
    rpc GetCustomerDetail(GetCustomerDetailReq) returns (GetCustomerDetailRes) {}
    rpc UpdateCustomer(UpdateCustomerReq) returns (UpdateCustomerRes) {}
    rpc DeleteCustomer(DeleteCustomerReq) returns (DeleteCustomerRes) {}
    rpc SyncCustomer(SyncCustomerReq) returns (SyncCustomerRes) {}
    rpc PublishCustomer(PublishCustomerReq) returns (PublishCustomerRes) {}
}

// 获取商户列表请求
message GetCustomerListReq {}

// 获取商户列表响应
message GetCustomerListRes {
    repeated CustomerItem list = 1;
}

// 获取商户详情请求
message GetCustomerDetailReq {
    int32 id = 1;           // v: required|min:1
}

// 获取商户详情响应
message GetCustomerDetailRes {
    CustomerItem data = 1;
}

// 商户项
message CustomerItem {
    int32 id = 1;
    string code = 2;
    string name = 3;
    string timezone = 4;
    string currency = 5;
    int32 status = 6;           // 状态。1=正常；0=禁用
    string kv_config = 7;       // KV配置详情
    string db_link_site = 8;    // site数据库连接
    string db_link_balance = 9; // balance数据库连接
    string db_link_game = 10;   // game数据库连接
    int32 is_sync = 11;         // 是否发布同步。1=发布同步；0=未发布同步
    string created_at = 12;     // 创建时间
    string updated_at = 13;     // 更新时间
}

// 更新商户请求
message UpdateCustomerReq {
    int32 id = 1;               // v: required|min:1
    string name = 2;            // 商户名称
    string timezone = 3;        // 时区
    string currency = 4;        // 币种
    int32 status = 5;           // 状态。1=正常；0=禁用
    string kv_config = 6;       // KV配置详情
    string db_link_site = 7;    // site数据库连接
    string db_link_balance = 8; // balance数据库连接
    string db_link_game = 9;    // game数据库连接
    int32 is_sync = 10;         // 是否发布同步。1=发布同步；0=未发布同步
}

// 更新商户响应
message UpdateCustomerRes {}

// 删除商户请求
message DeleteCustomerReq {
    int32 id = 1;           // v: required|min:1
}

// 删除商户响应
message DeleteCustomerRes {}

// 同步商户请求
message SyncCustomerReq {
    repeated CustomerItem data = 1;
}

// 同步商户响应
message SyncCustomerRes {}

// 发布商户请求
message PublishCustomerReq {
    int32 id = 1;           // 商户ID
}

// 发布商户响应
message PublishCustomerRes {
    bool success = 1;       // 发布是否成功
    string message = 2;     // 发布结果消息
}