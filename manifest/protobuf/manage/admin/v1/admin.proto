syntax = "proto3";

package manage_admin;

option go_package = "./api/manage/admin/v1";

service Admin {
    rpc Login(ManageLoginReq) returns (ManageLoginRes) {}
    rpc RefreshToken(ManageRefreshTokenReq) returns (ManageRefreshTokenRes) {}
    rpc GetInfo(ManageGetInfoReq) returns (ManageGetInfoRes) {}
    rpc Logout(ManageLogoutReq) returns (ManageLogoutRes) {}
    rpc Menus(ManageMenusReq) returns (ManageMenusRes) {}
}

message ManageLoginReq {
    string username = 1; // v: required
    string password = 2; // v: required
}

message ManageLoginRes {
    string token = 1;
    string message = 2;
}

message ManageRefreshTokenReq {}

message ManageRefreshTokenRes {
    string token = 1;
}

// 获取管理员信息请求
message ManageGetInfoReq {}

// 获取管理员信息响应
message ManageGetInfoRes {
    repeated string roles = 1;        // 角色列表
    string name = 2;                  // 管理员名称
    string avatar = 3;                // 头像
    string introduction = 4;          // 介绍
}

// 退出登录请求
message ManageLogoutReq {}

// 退出登录响应
message ManageLogoutRes {
    bool success = 1;                 // 是否成功
    string message = 2;               // 响应消息
}

// 获取菜单列表请求
message ManageMenusReq {}

// 菜单信息
message MenuInfo {
    int32 id = 1;                     // 菜单ID
    int32 type = 2;                   // 菜单类型
    string name = 3;                  // 菜单名称
    string path = 4;                  // 菜单路径
    int32 sort = 5;                   // 排序
    repeated MenuInfo children = 6;   // 子菜单
    string route_url = 7;             // 前端URL
    bool open = 8;                    // 是否展开
    bool checked = 9;                // 是否选中
    string icon = 10;                 // 图标
}

// 获取菜单列表响应
message ManageMenusRes {
    repeated MenuInfo menus = 1;      // 菜单列表
}