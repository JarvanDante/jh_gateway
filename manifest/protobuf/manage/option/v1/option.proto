syntax = "proto3";

package manage_option;

option go_package = "./api/manage/option/v1";

service ManageOption {
    rpc GetDomainTypeOptions(GetDomainTypeOptionsReq) returns (GetDomainTypeOptionsRes) {}
    rpc GetSiteOptions(GetSiteOptionsReq) returns (GetSiteOptionsRes) {}
    rpc CreateSiteDomain(CreateSiteDomainReq) returns (CreateSiteDomainRes) {}
    rpc UpdateSiteDomain(UpdateSiteDomainReq) returns (UpdateSiteDomainRes) {}
    rpc DeleteSiteDomain(DeleteSiteDomainReq) returns (DeleteSiteDomainRes) {}
    rpc GetSiteDomainList(GetSiteDomainListReq) returns (GetSiteDomainListRes) {}
}

// 获取域名类型选项请求
message GetDomainTypeOptionsReq {}

// 获取域名类型选项响应
message GetDomainTypeOptionsRes {
    repeated OptionItem list = 1;
}

// 选项项
message OptionItem {
    int32 value = 1;        // 选项值
    string label = 2;       // 选项标签
}

// 获取站点选项请求
message GetSiteOptionsReq {}

// 获取站点选项响应
message GetSiteOptionsRes {
    repeated SiteOptionItem list = 1;
}

// 站点选项项
message SiteOptionItem {
    string value = 1;       // 站点编码
    string label = 2;       // 站点名称
}

// 创建域名请求
message CreateSiteDomainReq {
    string site_code = 1;       // 站点编码
    string domain = 2;          // 域名
    int32 domain_type = 3;      // 域名类型
    int32 status = 4;           // 状态
}

// 创建域名响应
message CreateSiteDomainRes {}

// 更新域名请求
message UpdateSiteDomainReq {
    int64 id = 1;               // 域名ID
    string site_code = 2;       // 站点编码
    string domain = 3;          // 域名
    int32 domain_type = 4;      // 域名类型
    int32 status = 5;           // 状态
}

// 更新域名响应
message UpdateSiteDomainRes {}

// 删除域名请求
message DeleteSiteDomainReq {
    int64 id = 1;               // 域名ID
}

// 删除域名响应
message DeleteSiteDomainRes {}

// 获取域名列表请求
message GetSiteDomainListReq {
    int32 page = 1;             // 页码
    int32 size = 2;             // 每页数量
    string site_code = 3;       // 站点编码筛选
    int32 domain_type = 4;      // 域名类型筛选
    int32 status = 5;           // 状态筛选
}

// 获取域名列表响应
message GetSiteDomainListRes {
    repeated SiteDomainItem list = 1;
    int32 total = 2;
}

// 域名项
message SiteDomainItem {
    int64 id = 1;
    string site_code = 2;
    string domain = 3;
    int32 domain_type = 4;
    int32 status = 5;
    string created_at = 6;
    string updated_at = 7;
}